[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket2skill"
version = "0.3.2"
description = "Turn resolved enterprise tickets into tested, versioned agent skills"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "google-cloud-firestore>=2.21,<3",
  "google-genai>=1.40,<2",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
